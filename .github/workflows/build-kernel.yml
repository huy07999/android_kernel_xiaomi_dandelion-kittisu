name: Build KittiSU kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: Device defconfig to build
        required: true
        default: dandelion
        type: choice
        options:
          - dandelion
          - angelica
          - angelican
          - angelicain
          - cattail
  push:
    branches:
      - main
    paths:
      - KittiSU/**
      - arch/arm64/configs/**
      - fs/**
      - kernel/**
      - security/**
      - Kconfig
      - Makefile
      - .github/workflows/build-kernel.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      DEVICE: ${{ github.event_name == 'workflow_dispatch' && inputs.device || 'dandelion' }}
      ARCH: arm64
      SUBARCH: arm64

    steps:
      - name: Check out kernel and KittiSU
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential cpio flex git libelf-dev libssl-dev python-is-python3 rsync

      - name: Fetch Android GCC 4.9 toolchain
        run: |
          git clone --depth=1 --branch android10-release \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            toolchain-aarch64
          git clone --depth=1 --branch android10-release \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 \
            toolchain-arm

      - name: Configure kernel
        run: |
          make ARCH="$ARCH" \
            CROSS_COMPILE="$GITHUB_WORKSPACE/toolchain-aarch64/bin/aarch64-linux-android-" \
            CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/toolchain-arm/bin/arm-linux-androideabi-" \
            "${DEVICE}_defconfig"
          grep -q '^CONFIG_KSU=y$' .config
          grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' .config

      - name: Build kernel
        run: |
          find arch scripts tools -type f \( -name '*.sh' -o -name '*.py' -o -name '*.pl' \) -exec chmod +x {} +
          chmod +x scripts/dtc/dtc_overlay
          make -j"$(nproc)" ARCH="$ARCH" \
            CROSS_COMPILE="$GITHUB_WORKSPACE/toolchain-aarch64/bin/aarch64-linux-android-" \
            CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/toolchain-arm/bin/arm-linux-androideabi-" \
            Image.gz-dtb

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp arch/arm64/boot/Image.gz-dtb "artifacts/Image.gz-dtb-${DEVICE}"
          cp .config "artifacts/config-${DEVICE}"

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: kittisu-kernel-${{ env.DEVICE }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
